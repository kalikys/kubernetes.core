---
# https://github.com/ansible-collections/kubernetes.core/issues/897
- name: List namespaces with a request timeout
  k8s_info:
    kind: Namespace
    request_timeout: 30
  register: _namespaces

- name: Ensure the request succeeded
  assert:
    that:
      - _namespaces.resources | length > 0

- name: Record the start time
  set_fact:
    _start: "{{ now().timestamp() }}"

- name: Query an API server that does not answer (TEST-NET-1 address)
  k8s_info:
    kind: Namespace
    host: https://192.0.2.1:6443
    api_key: not-a-token
    validate_certs: false
    request_timeout: 2
  register: _unreachable
  ignore_errors: true

- name: Ensure the task failed quickly instead of hanging
  assert:
    that:
      - _unreachable is failed
      - (now().timestamp() - (_start | float)) < 60
